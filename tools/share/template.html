<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg:#f4f5f7; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6ea; --hl:#fff3d1;
  --a:#d1495b; --a-soft:rgba(209,73,91,.16); --b:#2e86ab; --b-soft:rgba(46,134,171,.16);
  --track:#e8ebef; --played:#c9ced6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f1216; --card:#181c22; --fg:#e7e9ee; --muted:#98a1ad; --line:#29303a; --hl:#352f1e;
    --a:#f07484; --a-soft:rgba(240,116,132,.18); --b:#5db6d9; --b-soft:rgba(93,182,217,.18);
    --track:#232932; --played:#3a424e;
  }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; }
body { background:var(--bg); color:var(--fg); font-family:system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
button { font:inherit; color:inherit; }
.a { color:var(--a); } .b { color:var(--b); }
small, .muted { color:var(--muted); }

/* ---- 共通の部品 ---- */
header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
header h1 { margin:0; font-size:.95rem; font-weight:600; color:var(--muted); }
.total { font-size:1.6rem; font-weight:800; white-space:nowrap; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; }

.stage { position:relative; overflow:hidden; background:#000; border-radius:10px; touch-action:none; }
.stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform-origin:0 0; }
.stage .empty { position:absolute; inset:0; display:grid; place-items:center; color:#aaa; }
.stage .zoomtag { position:absolute; right:8px; top:8px; background:rgba(0,0,0,.55); color:#fff; font-size:.75rem;
  padding:2px 8px; border-radius:99px; pointer-events:none; opacity:0; transition:opacity .2s; }
.stage .zoomtag.show { opacity:1; }
.stage .now { position:absolute; left:10px; top:8px; background:rgba(0,0,0,.55); color:#fff; font-weight:800;
  font-size:1.1rem; padding:2px 10px; border-radius:8px; pointer-events:none; font-variant-numeric:tabular-nums; }

.controls { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.controls button { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:5px 10px; cursor:pointer; min-height:34px; }
.controls button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
.controls .time { font-variant-numeric:tabular-nums; color:var(--muted); margin-right:auto; padding-left:4px; }
.controls .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }

/* 得点を並べたシークバー。上の段が A、下の段が B の点 */
.seek { position:relative; height:76px; cursor:pointer; user-select:none; }
.seek .track { position:absolute; left:0; right:0; top:32px; height:12px; border-radius:6px; background:var(--track); overflow:hidden; }
.seek .played { position:absolute; left:0; top:0; bottom:0; background:var(--played); }
.seek .head { position:absolute; top:24px; width:3px; height:28px; margin-left:-1px; background:var(--fg); border-radius:2px; pointer-events:none; }
.seek .mk { position:absolute; width:20px; margin-left:-10px; display:flex; flex-direction:column; align-items:center; }
.seek .mk.a { top:0; } .seek .mk.b { top:46px; flex-direction:column-reverse; }
.seek .mk i { display:block; width:4px; height:10px; border-radius:2px; background:currentColor; }
.seek .mk b { font-size:.72rem; font-weight:700; line-height:1.25; white-space:nowrap; font-variant-numeric:tabular-nums; }
.seek .mk.hide b { visibility:hidden; }
.seek .mk:hover b, .seek .mk.cur b { visibility:visible; }
.seek .mk.cur i { height:14px; width:6px; }
.seek .tip { position:absolute; top:-6px; transform:translate(-50%,-100%); background:var(--fg); color:var(--bg); font-size:.8rem;
  padding:3px 8px; border-radius:6px; white-space:nowrap; pointer-events:none; display:none; z-index:2; }

/* ゲームの一覧と流れ */
.games { display:flex; flex-direction:column; }
.game { display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:10px; padding:5px 10px;
  border:0; border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer; }
.game:last-child { border-bottom:0; }
.game.sel { background:var(--hl); }
.game .no { font-size:.8rem; color:var(--muted); }
.game .sc { font-weight:800; font-variant-numeric:tabular-nums; text-align:right; }
.game .sc small { font-weight:400; margin-left:6px; }
.game svg { grid-column:1 / -1; width:100%; height:36px; display:block; margin-top:2px; }

.stats { width:100%; border-collapse:collapse; font-size:.85rem; }
.stats th, .stats td { padding:5px 4px; text-align:center; font-variant-numeric:tabular-nums; border-top:1px solid var(--line); }
.stats th:first-child { text-align:left; }
.stats thead th { color:var(--muted); font-weight:500; border-top:0; }

/* ---- PC：1画面に収める ---- */
@media (min-width: 960px) and (min-height: 560px) {
  body { height:100vh; overflow:hidden; }
  .app { height:100vh; display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:14px; padding:14px; }
  .left { min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; gap:10px; }
  .stage { min-height:0; }
  .right { min-height:0; display:grid; grid-template-rows:minmax(0,1fr) auto; gap:14px; }
  .right .games { overflow:auto; }
  .right .panel { min-height:0; }
}

/* ---- スマホ：縦に並べてスクロール ---- */
@media not all and (min-width: 960px) and (min-height: 560px) {
  .app { display:flex; flex-direction:column; gap:12px; padding:12px 12px 40px; }
  .left { display:flex; flex-direction:column; gap:8px; }
  .stage { aspect-ratio:16/9; }
  .total { font-size:1.3rem; }
  .right { display:flex; flex-direction:column; gap:12px; }
  .controls button { padding:6px 9px; }
}
</style>
</head>
<body>
<div class="app">
  <section class="left">
    <header>
      <h1>{{DATE}}</h1>
      <div class="total"><span class="a">{{A}} {{WA}}</span> - <span class="b">{{WB}} {{B}}</span></div>
    </header>
    <div class="stage" id="stage">
      <video id="v" playsinline preload="metadata"></video>
      <div class="empty" id="empty" hidden>動画なし</div>
      <div class="now" id="now"></div>
      <div class="zoomtag" id="zoomtag"></div>
    </div>
    <div class="seek" id="seek">
      <div class="track"><div class="played" id="played"></div></div>
      <div class="head" id="head"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="controls">
      <button id="play" aria-label="再生">▶</button>
      <button id="prev" aria-label="前の点">⏮</button>
      <button id="next" aria-label="次の点">⏭</button>
      <span class="time" id="time">0:00 / 0:00</span>
      <button data-rate="0.5">0.5×</button><button data-rate="1" class="on">1×</button><button data-rate="2">2×</button>
      <span class="sep"></span>
      <button id="fit">全体</button><button id="close">寄る</button>
    </div>
  </section>

  <section class="right">
    <div class="panel games" id="games"></div>
    <div class="panel" style="padding:6px 10px">
      <table class="stats">
        <thead><tr><th></th><th>得点</th><th>サーブ</th><th>レシーブ</th><th>連続</th></tr></thead>
        <tbody>{{STATS}}</tbody>
      </table>
    </div>
  </section>
</div>

<script>
const DATA = {{DATA}};
// 点が入ったのはラリーの終わり。少し前から見せる
const LEAD = 8;
// 「寄る」の倍率と、映す中心（映像の縦の位置。天井を切って台と2人に寄せる）
const CLOSE = { zoom: 1.35, cx: 0.5, cy: 0.6 };

const v = document.getElementById('v');
const stage = document.getElementById('stage');
const seek = document.getElementById('seek');
let current = 0;
let view = { zoom: 1, cx: 0.5, cy: 0.5 };

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, x) { try { localStorage.setItem(k, x); } catch {} } };

// ---------- 流れのグラフ（中央線より上は A のリード、下は B のリード） ----------
function flowSVG(g, id, mark) {
  const W = 300, H = 36, M = H / 2, n = g.points.length;
  const ds = [0, ...g.points.map(p => p.s[0] - p.s[1])];
  const max = Math.max(3, ...ds.map(Math.abs));
  const x = i => (i / n) * (W - 4) + 2, y = d => M - d / max * (M - 3);
  // 1点ごとの階段にする（どこで点が動いたかが見やすい）
  let line = `M${x(0)} ${y(0)}`;
  for (let i = 1; i <= n; i++) line += ` H${x(i).toFixed(1)} V${y(ds[i]).toFixed(1)}`;
  const area = `${line} V${M} H${x(0)} Z`;
  const markX = mark == null ? null : x(mark + 1);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <clipPath id="t${id}"><rect x="0" y="0" width="${W}" height="${M}"/></clipPath>
      <clipPath id="u${id}"><rect x="0" y="${M}" width="${W}" height="${M}"/></clipPath>
    </defs>
    <g clip-path="url(#t${id})"><path d="${area}" fill="var(--a-soft)"/><path d="${line}" fill="none" stroke="var(--a)" stroke-width="2" vector-effect="non-scaling-stroke"/></g>
    <g clip-path="url(#u${id})"><path d="${area}" fill="var(--b-soft)"/><path d="${line}" fill="none" stroke="var(--b)" stroke-width="2" vector-effect="non-scaling-stroke"/></g>
    <line x1="0" x2="${W}" y1="${M}" y2="${M}" stroke="var(--muted)" stroke-width="1" opacity=".55" vector-effect="non-scaling-stroke"/>
    ${markX == null ? '' : `<line x1="${markX}" x2="${markX}" y1="0" y2="${H}" stroke="var(--fg)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`}
  </svg>`;
}

function renderGames(mark) {
  const box = document.getElementById('games');
  box.innerHTML = DATA.games.map((g, i) => {
    const cls = g.winner === null ? '' : (g.winner === 0 ? 'a' : 'b');
    return `<button class="game ${i === current ? 'sel' : ''}" data-i="${i}">
      <span class="no">第${g.n}ゲーム</span>
      <span class="sc ${cls}">${g.final[0]} - ${g.final[1]}<small>${g.winner === null ? '途中' : g.minutes + '分'}</small></span>
      ${flowSVG(g, i, i === current ? mark : null)}
    </button>`;
  }).join('');
  box.querySelectorAll('.game').forEach(b => b.onclick = () => select(+b.dataset.i, true));
}

// ---------- シークバー ----------
function points() { return DATA.games[current].points.filter(p => p.vt !== null); }

function renderMarkers() {
  seek.querySelectorAll('.mk').forEach(m => m.remove());
  const d = v.duration;
  if (!d) return;
  const width = seek.clientWidth;
  let lastX = [-99, -99];
  points().forEach(p => {
    const m = document.createElement('div');
    const x = p.vt / d * width;
    m.className = `mk ${p.w === 0 ? 'a' : 'b'}`;
    m.style.left = `${x}px`;
    m.style.color = p.w === 0 ? 'var(--a)' : 'var(--b)';
    m.innerHTML = `<b>${p.s[0]}-${p.s[1]}</b><i></i>`;
    // 文字が重なるところは数字を隠す（触れると出る）
    const label = `${p.s[0]}-${p.s[1]}`.length * 7 + 8;
    if (x - lastX[p.w] < label) m.classList.add('hide'); else lastX[p.w] = x;
    m.dataset.vt = p.vt;
    m.onclick = e => { e.stopPropagation(); jump(p); };
    m.onmouseenter = () => showTip(x, `${p.s[0]} - ${p.s[1]}　${DATA.names[p.w]}　${p.t}`);
    m.onmouseleave = hideTip;
    seek.appendChild(m);
  });
  updateHead();
}

function showTip(x, text) { const t = document.getElementById('tip'); t.textContent = text; t.style.left = `${x}px`; t.style.display = 'block'; }
function hideTip() { document.getElementById('tip').style.display = 'none'; }

function seekFromEvent(e) {
  if (!v.duration) return;
  const r = seek.getBoundingClientRect();
  v.currentTime = Math.min(Math.max(0, (e.clientX - r.left) / r.width), 1) * v.duration;
}
let seeking = false;
seek.addEventListener('pointerdown', e => { if (e.target.closest('.mk')) return; seeking = true; seek.setPointerCapture(e.pointerId); seekFromEvent(e); });
seek.addEventListener('pointermove', e => { if (seeking) seekFromEvent(e); });
seek.addEventListener('pointerup', () => { seeking = false; });

function currentIndex() {
  const ps = DATA.games[current].points;
  let k = -1;
  // ラリーを見せるために LEAD 秒前から再生するので、その間は前の点のまま
  ps.forEach((p, i) => { if (p.vt !== null && p.vt <= v.currentTime + 0.3) k = i; });
  return k;
}

let lastMark = null;
function updateHead() {
  const d = v.duration || 0;
  const f = d ? v.currentTime / d : 0;
  document.getElementById('played').style.width = `${f * 100}%`;
  document.getElementById('head').style.left = `${f * seek.clientWidth}px`;
  document.getElementById('time').textContent = `${fmt(v.currentTime)} / ${fmt(d)}`;
  const k = currentIndex();
  const p = DATA.games[current].points[k];
  document.getElementById('now').textContent = p ? `${p.s[0]} - ${p.s[1]}` : '0 - 0';
  seek.querySelectorAll('.mk').forEach(m => m.classList.toggle('cur', !!p && +m.dataset.vt === p.vt));
  if (k !== lastMark) { lastMark = k; renderGames(k); }
}

function jump(p) {
  v.currentTime = Math.max(0, p.vt - LEAD);
  v.play();
}

function step(dir) {
  const ps = points();
  if (!ps.length) return;
  const t = v.currentTime + LEAD;
  const next = dir > 0 ? ps.find(p => p.vt > t + 0.5) : [...ps].reverse().find(p => p.vt < t - 1.5);
  if (next) jump(next); else if (dir < 0) v.currentTime = 0;
}

// ---------- 再生 ----------
function select(i, autoplay) {
  current = i;
  lastMark = null;
  const g = DATA.games[i];
  document.getElementById('empty').hidden = !!g.video;
  v.hidden = !g.video;
  if (g.video) { v.src = g.video; } else { v.removeAttribute('src'); v.load(); }
  v.playbackRate = rate;
  renderGames(null);
  seek.querySelectorAll('.mk').forEach(m => m.remove());
  if (autoplay && g.video) {
    v.addEventListener('loadedmetadata', () => {
      const first = g.points.find(p => p.vt !== null);
      if (first) v.currentTime = Math.max(0, first.vt - LEAD);
      v.play();
    }, { once: true });
  }
}

v.addEventListener('loadedmetadata', () => { renderMarkers(); applyView(); });
v.addEventListener('timeupdate', updateHead);
v.addEventListener('seeked', updateHead);
v.addEventListener('play', () => document.getElementById('play').textContent = '❚❚');
v.addEventListener('pause', () => document.getElementById('play').textContent = '▶');
document.getElementById('play').onclick = () => v.paused ? v.play() : v.pause();
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);

let rate = 1;
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
  rate = +b.dataset.rate; v.playbackRate = rate;
  document.querySelectorAll('[data-rate]').forEach(x => x.classList.toggle('on', x === b));
});

addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); select(Math.min(current + 1, DATA.games.length - 1), true); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); select(Math.max(current - 1, 0), true); }
});
addEventListener('resize', () => { renderMarkers(); applyView(); });

// ---------- 画角（拡大と、ドラッグで位置合わせ） ----------
// 映像が枠に収まる大きさ（contain）を基準に、zoom 倍して、映像上の (cx, cy) を枠の中央に置く
function applyView() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const vw = v.videoWidth || 16, vh = v.videoHeight || 9;
  const base = Math.min(W / vw, H / vh);
  const s = base * view.zoom;
  const dw = vw * s, dh = vh * s;
  // 黒い余白が出ないよう、中心の動ける範囲を絞る
  const clamp = (c, size, box) => size <= box ? 0.5 : Math.min(Math.max(c, box / 2 / size), 1 - box / 2 / size);
  view.cx = clamp(view.cx, dw, W); view.cy = clamp(view.cy, dh, H);
  const tx = W / 2 - view.cx * dw, ty = H / 2 - view.cy * dh;
  v.style.objectFit = 'fill';
  v.style.width = `${dw}px`; v.style.height = `${dh}px`;
  v.style.left = '0'; v.style.top = '0'; v.style.right = 'auto'; v.style.bottom = 'auto';
  v.style.transform = `translate(${tx}px, ${ty}px)`;
  document.getElementById('fit').classList.toggle('on', view.zoom === 1);
  document.getElementById('close').classList.toggle('on', view.zoom !== 1);
  store.set('view', JSON.stringify(view));
}
function setZoom(z, keepCenter) {
  view.zoom = Math.min(Math.max(z, 1), 3);
  const tag = document.getElementById('zoomtag');
  tag.textContent = `${view.zoom.toFixed(2)}×`; tag.classList.add('show');
  clearTimeout(setZoom.t); setZoom.t = setTimeout(() => tag.classList.remove('show'), 800);
  applyView();
}
document.getElementById('fit').onclick = () => { view = { zoom: 1, cx: .5, cy: .5 }; setZoom(1); };
document.getElementById('close').onclick = () => { view = { ...CLOSE }; setZoom(CLOSE.zoom); };
stage.addEventListener('wheel', e => { e.preventDefault(); setZoom(view.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, { passive: false });

// ドラッグで動かす。動かさずに離したら再生／一時停止
let drag = null;
stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: false }; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
  if (!drag.moved || view.zoom === 1) return;
  const w = parseFloat(v.style.width), h = parseFloat(v.style.height);
  view.cx = drag.cx - dx / w; view.cy = drag.cy - dy / h;
  applyView();
});
stage.addEventListener('pointerup', () => { if (drag && !drag.moved && v.src) { v.paused ? v.play() : v.pause(); } drag = null; });
stage.addEventListener('dblclick', () => { document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen?.(); });
document.addEventListener('fullscreenchange', () => setTimeout(applyView, 50));

try { const saved = JSON.parse(store.get('view')); if (saved && saved.zoom) view = saved; } catch {}
select(0, false);
</script>
</body>
</html>
