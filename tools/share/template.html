<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卓球</title>
<script>
// PC と横向きのスマホは、動画とゲーム一覧を横に並べて1画面に。縦長はスマホの配置
const WIDE = '(min-width: 960px) and (min-height: 560px), (orientation: landscape) and (min-width: 560px)';
// 全画面と、横向きのスマホ（低い）は、シークバーとボタンを動画の上に重ねる
const LOW = '(max-height: 559px)';
function setWide() {
  const c = document.documentElement.classList, fs = c.contains('fs');
  c.toggle('wide', fs || matchMedia(WIDE).matches);
  c.toggle('ov', fs || (c.contains('wide') && matchMedia(LOW).matches));
}
setWide();
matchMedia(WIDE).addEventListener('change', setWide);
matchMedia(LOW).addEventListener('change', setWide);
</script>
<style>
:root {
  --bg:#f4f5f7; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6ea; --hl:#fff3d1;
  --a:#d1495b; --a-soft:rgba(209,73,91,.16); --b:#2e86ab; --b-soft:rgba(46,134,171,.16);
  --track:#e8ebef; --played:#c9ced6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0f1216; --card:#181c22; --fg:#e7e9ee; --muted:#98a1ad; --line:#29303a; --hl:#352f1e;
    --a:#f07484; --a-soft:rgba(240,116,132,.18); --b:#5db6d9; --b-soft:rgba(93,182,217,.18);
    --track:#232932; --played:#3a424e;
  }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; }
body { background:var(--bg); color:var(--fg); font-family:system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
button { font:inherit; color:inherit; }
.a { color:var(--a); } .b { color:var(--b); }
small, .muted { color:var(--muted); }

/* ---- 共通の部品 ---- */
header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
header h1 { margin:0; font-size:.95rem; font-weight:600; color:var(--muted); }
/* 回の切り替え：見出しの見た目のまま、▾ を付ける */
header h1 .session { font:inherit; color:inherit; background:none; border:1px solid transparent; border-radius:8px;
  padding:2px 4px; cursor:pointer; }
header h1 .session:hover { border-color:var(--line); }
.total { font-size:1.6rem; font-weight:800; white-space:nowrap; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; }

.stage { position:relative; overflow:hidden; background:#000; border-radius:10px; touch-action:none; }
.stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform-origin:0 0; }
.stage .empty { position:absolute; inset:0; display:grid; place-items:center; color:#aaa; }
/* 読み込み中・エラー（動画の場所に重ねる） */
.boot { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:10px; padding:20px;
  background:#000; color:#ddd; text-align:center; z-index:3; }
/* ドライブから見るとき、押すまで動画を読まない */
.bigplay { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:84px; height:84px; border-radius:50%;
  border:0; background:rgba(255,255,255,.92); color:#111; cursor:pointer; z-index:2; box-shadow:0 4px 20px rgba(0,0,0,.4);
  display:grid; place-items:center; }
.bigplay:hover { background:#fff; }
.bigplay svg { width:40px; height:40px; fill:currentColor; margin-left:6px; }
.boot .spin { width:34px; height:34px; border-radius:50%; border:3px solid rgba(255,255,255,.2); border-top-color:#fff;
  animation:spin .9s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.boot h2 { margin:0; font-size:1.05rem; color:#fff; }
.boot p { margin:0; font-size:.85rem; color:#aaa; max-width:32em; line-height:1.6; }
.boot button { margin-top:4px; border:1px solid #666; background:none; color:#fff; border-radius:8px; padding:6px 16px; cursor:pointer; }
.boot .err { font-size:1.8rem; }
.boot .choose { display:flex; flex-direction:column; gap:8px; min-width:200px; max-height:60vh; overflow:auto; }
.boot .choose button { font-size:1rem; padding:10px 16px; }
/* スケルトン（データが来るまでの仮の枠） */
.skel { background:linear-gradient(90deg, var(--track) 25%, var(--line) 50%, var(--track) 75%); background-size:200% 100%;
  animation:shimmer 1.4s ease-in-out infinite; border-radius:8px; }
@keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
.skel-game { height:64px; margin:6px 8px; }
.skel-line { display:inline-block; height:1em; vertical-align:middle; }
.stage .zoomtag { position:absolute; right:8px; top:8px; background:rgba(0,0,0,.55); color:#fff; font-size:.75rem;
  padding:2px 8px; border-radius:99px; pointer-events:none; opacity:0; transition:opacity .2s; }
.stage .zoomtag.show { opacity:1; }
.stage .rotreset { position:absolute; left:8px; top:8px; z-index:5; border:0; border-radius:99px; background:rgba(0,0,0,.55); color:#fff;
  font-size:.75rem; padding:3px 9px; cursor:pointer; font-variant-numeric:tabular-nums; white-space:nowrap; }
html.ov.idle .stage .rotreset { opacity:0; pointer-events:none; }
.stage .now { position:absolute; left:50%; transform:translateX(-50%); top:8px; background:rgba(0,0,0,.6); color:#fff; font-weight:800;
  font-size:1.1rem; padding:2px 12px; border-radius:8px; pointer-events:none; font-variant-numeric:tabular-nums; white-space:nowrap; }
.stage .now .a { color:#ff9aa6; } .stage .now .b { color:#8fd3ef; }
.stage .cap { position:absolute; left:50%; bottom:6%; transform:translateX(-50%); max-width:90%; text-align:center;
  background:rgba(0,0,0,.65); color:#fff; font-weight:700; font-size:clamp(.95rem, 2.4vw, 1.5rem); padding:4px 14px;
  border-radius:8px; pointer-events:none; }

.controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.controls button { border:1px solid transparent; background:none; border-radius:8px; padding:4px 9px; cursor:pointer; min-height:36px; min-width:36px; font-size:.95rem;
  display:inline-flex; align-items:center; justify-content:center; gap:5px; color:var(--fg); }
.controls button svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
/* 設定を開くボタン（オン・オフではない）：枠線と ▾。開いている間だけ薄く色 */
.controls button.menu { border-color:var(--line); }
.controls button.menu.open { background:var(--track); }
.controls button .caret { width:14px; height:14px; margin-left:-2px; opacity:.7; }
/* 幅が狭いときは記号だけ */
@media (max-width: 720px) { .controls .lbl { display:none; } }
.controls button:hover { background:var(--track); }
.controls .grp { display:flex; gap:6px; align-items:center; }
.controls .brk { display:none; }
.controls .sepgrp { border-left:1px solid var(--line); padding-left:10px; }
/* オンオフ：オンは明るく下にランプ、オフは薄く */
.controls button.tg { position:relative; color:var(--muted); }
.controls button.tg svg { opacity:.5; }
.controls button.tg::after { content:''; position:absolute; left:22%; right:22%; bottom:1px; height:3px; border-radius:2px; background:transparent; }
.controls button.tg.on { color:var(--fg); }
.controls button.tg.on svg { opacity:1; }
.controls button.tg.on::after { background:#2fae66; }
.controls #rate.on { font-weight:800; background:var(--track); }
.controls #save.on { background:var(--track); }
.controls #play { width:44px; height:44px; border-radius:50%; background:var(--fg); color:var(--bg); font-size:1.1rem; }
.controls #play:hover { background:var(--fg); opacity:.85; }
.controls .time { font-variant-numeric:tabular-nums; color:var(--muted); margin-right:auto; padding-left:4px; }
.controls .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }

/* 得点を並べたシークバー。上の段が A、下の段が B の点 */
/* 上の段（赤）：点数・印、帯、下の段（青）：印・点数 */
.seek { position:relative; height:72px; cursor:pointer; user-select:none; }
.seek .track { position:absolute; left:0; right:0; top:28px; height:12px; border-radius:6px; background:var(--track); overflow:hidden; }
.seek .played { position:absolute; left:0; top:0; bottom:0; background:var(--played); }
.seek .band { position:absolute; top:0; bottom:0; opacity:.3; box-shadow:inset -1px 0 0 var(--card); }
.seek .head { position:absolute; top:20px; width:3px; height:28px; margin-left:-1px; background:var(--fg); border-radius:2px; pointer-events:none; }
.seek .mk { position:absolute; width:20px; margin-left:-10px; display:flex; flex-direction:column; align-items:center; }
.seek .mk.a { top:0; } .seek .mk.b { top:44px; flex-direction:column-reverse; }
.seek .mk i { display:block; width:4px; height:10px; border-radius:2px; background:currentColor; }
.seek .mk b { font-size:.72rem; font-weight:700; line-height:1.25; white-space:nowrap; font-variant-numeric:tabular-nums; }
.seek .mk.hide b { visibility:hidden; }
.seek .mk:hover b, .seek .mk.cur b { visibility:visible; }
.seek .mk.cur i { height:14px; width:6px; }
.seek .tip { position:absolute; top:-6px; transform:translate(-50%,-100%); background:var(--fg); color:var(--bg); font-size:.8rem;
  padding:3px 8px; border-radius:6px; white-space:nowrap; pointer-events:none; display:none; z-index:2; }

/* ☆を付けた点の区間 */
:root { --star:#e0a100; }
.seek .starband { position:absolute; top:22px; height:24px; box-sizing:border-box; border:2px solid var(--star); border-radius:4px;
  background:color-mix(in srgb, var(--star) 28%, transparent); pointer-events:none; z-index:1; }
.controls #mark { font-size:1.25rem; color:var(--muted); }
.controls #mark.on { color:var(--star); }
/* スクロールバー：細く、目立たない色に */
* { scrollbar-width:thin; scrollbar-color:color-mix(in srgb, var(--muted) 35%, transparent) transparent; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--muted) 35%, transparent); border-radius:4px; }

/* ゲームの一覧と流れ */
.games { display:flex; flex-direction:column; padding-bottom:var(--clip-h, 0px); }
.games .game { flex:none; }
.game { display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:10px; padding:5px 10px;
  border:0; border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer; }
.game:last-child { border-bottom:0; }
.game.sel { background:var(--hl); }
.game .no { font-size:.8rem; color:var(--muted); }
.game .sc { font-weight:800; font-variant-numeric:tabular-nums; text-align:right; }
.game .sc small { font-weight:400; margin-left:6px; }
.game svg { grid-column:1 / -1; width:100%; height:36px; display:block; margin-top:2px; }
/* ドライブ：まだ読んでいないゲームは暗く。読み込み中は左から明るく */
.game { position:relative; --dim:rgba(20,24,32,.22); }
.game.need::after { content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to right, transparent var(--p, 0%), var(--dim) var(--p, 0%)); }
.game.err .no::after { content:' ⚠'; }
@media (prefers-color-scheme: dark) { .game { --dim:rgba(0,0,0,.5); } }
#dlpop { position:fixed; width:220px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.18); z-index:21; display:grid; gap:6px; font-size:.9rem; }
#dlpop .sub { margin:0; color:var(--muted); font-variant-numeric:tabular-nums; }
#dlpop .row { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
#dlpop button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:.9rem; white-space:nowrap; }
#dlpop .go { background:var(--fg); color:var(--bg); border-color:var(--fg); }
/* 通信量の注意 */
#datanote { position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:22; display:flex; align-items:center; gap:6px;
  background:var(--fg); color:var(--bg); border-radius:20px; padding:4px 6px 4px 14px; font-size:.8rem; white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.2); }
#datanote button { border:0; background:none; color:inherit; cursor:pointer; width:28px; height:28px; }

/* 情報のポップオーバー */
.drivelink { display:inline-grid; place-items:center; text-decoration:none; }
.drivelink svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.boot a.drive, .boot button { white-space:nowrap; }
.boot a.drive { margin-top:4px; color:#fff; border:1px solid #666; border-radius:8px; padding:6px 16px; text-decoration:none; }
.info { border:0; background:none; cursor:pointer; color:var(--muted); font-size:1.1rem; width:32px; height:32px; border-radius:50%; }
.info:hover { background:var(--track); }
#infopop, #facepop, #clippop { overscroll-behavior:contain; }
#drivepop { position:fixed; top:52px; right:14px; width:min(300px, calc(100vw - 24px)); background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:12px 14px; box-shadow:0 10px 30px rgba(0,0,0,.18); z-index:21; display:grid; gap:10px; font-size:.9rem; }
#drivepop p { margin:0; }
#drivepop .row { display:flex; gap:8px; justify-content:flex-end; }
#drivepop .row > * { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:6px 14px;
  cursor:pointer; font-size:.9rem; text-decoration:none; }
#drivepop .go { background:var(--fg); color:var(--bg); border-color:var(--fg); }
#infopop { position:fixed; top:56px; right:14px; width:min(380px, calc(100vw - 24px)); max-height:calc(100vh - 80px); overflow:auto;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:0 10px 30px rgba(0,0,0,.18); z-index:20; }
#infopop p { margin:4px 0 10px; font-size:.85rem; }
/* 切り出し */
.stage canvas.mask { position:absolute; left:0; top:0; transform-origin:0 0; pointer-events:none; }
#clippop { position:fixed; right:14px; bottom:14px; width:min(320px, calc(100vw - 24px)); background:var(--card);
  border:1px solid var(--line); border-radius:12px; padding:12px 14px; box-shadow:0 10px 30px rgba(0,0,0,.18); z-index:20;
  display:grid; gap:10px; font-size:.9rem; }
#clippop .row { display:flex; align-items:center; gap:8px; }
#clippop .row > span:first-child { width:3.5em; color:var(--muted); }
#clippop .t { font-variant-numeric:tabular-nums; min-width:4.5em; }
#clippop button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:4px 10px;
  cursor:pointer; min-height:32px; }
#clippop button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
#clippop .go { background:var(--fg); color:var(--bg); font-weight:700; }
#clippop .msg { font-size:.9rem; }
#clippop .msg:empty { display:none; }
#clippop .pick { display:grid; gap:10px; }
#clippop .pickrow { display:grid; justify-items:start; gap:6px; padding-right:34px; }
#clippop #clipsize { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
#clippop .seg button { position:relative; z-index:1; border:0; background:none; color:var(--muted); min-height:36px;
  padding:4px 16px; font-size:.95rem; white-space:nowrap; }
#clippop .seg button.on { color:var(--fg); font-weight:700; background:none; }
#clippop #clipdl { color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
#clippop .chks { display:flex; gap:14px; }
#clippop .chk[hidden] { display:none; }
#clippop .chk { display:inline-flex; align-items:center; gap:6px; width:max-content; font-size:.85rem; color:var(--muted); cursor:pointer; }
#clippop .chk input { width:15px; height:15px; margin:0; accent-color:var(--fg); }
#clippop #clipgo { min-height:40px; }
#facepop { position:fixed; right:14px; bottom:14px; width:min(340px, calc(100vw - 24px)); max-height:calc(100vh - 80px);
  overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.18); z-index:20; display:grid; gap:10px; font-size:.9rem; }
#facepop .row { display:flex; align-items:center; gap:8px; }
#facepop .row > span:first-child { width:4.5em; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#facepop button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:4px 10px;
  cursor:pointer; min-height:32px; }
#facepop button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
#facepop .who { display:grid; gap:6px; padding:10px; border:1px solid var(--line); border-radius:10px; }
#facepop .who .name { font-weight:800; font-size:1.05rem; }
#facepop .who .opts { display:flex; gap:8px; align-items:center; }
#facepop .who .head { display:flex; align-items:center; gap:6px; }
#facepop .eye { border:1px solid var(--line); background:none; padding:2px 10px 2px 6px; min-height:32px; color:var(--fg); border-radius:16px;
  display:inline-flex; align-items:center; gap:4px; font-size:.85rem; margin-left:6px; }
#facepop .eye.off { color:var(--muted); }
#facepop .eye svg { width:20px; height:20px; display:block; }
/* スライドする切り替え */
.seg { display:inline-grid; grid-auto-flow:column; grid-auto-columns:1fr; position:relative; background:var(--track);
  border-radius:10px; padding:3px; }
.seg .knob { position:absolute; top:3px; bottom:3px; left:3px; border-radius:8px; background:var(--card);
  box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .18s ease; }
#facepop .seg button { position:relative; z-index:1; border:0; background:none; color:var(--muted); min-height:36px;
  padding:4px 10px; font-size:.95rem; white-space:nowrap; }
#facepop .seg button.on { color:var(--fg); font-weight:700; background:none; }
#facepop .who input { width:2.6em; font-size:1.4rem; text-align:center; border:1px solid var(--line); border-radius:8px;
  background:var(--card); color:var(--fg); padding:0 2px; min-height:40px; }
#facepop .who input:disabled { opacity:.35; }
#facepop .more { justify-self:start; }
.popx { position:sticky; top:-12px; justify-self:end; margin:-6px -6px -10px 0; border:0 !important; background:var(--card) !important;
  font-size:1.2rem; width:40px; height:40px; z-index:1; }
#facepop .heads { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:8px; }
#facepop .hd { display:grid; gap:3px; justify-items:center; font-size:.75rem; color:var(--muted); padding:4px;
  border-radius:8px; border:2px solid transparent; }
#facepop .hd.cur { border-color:var(--fg); }
#facepop .hd img { width:56px; height:56px; border-radius:8px; cursor:pointer; background:var(--track); }
#facepop .hd select { max-width:88px; font-size:.75rem; }
#infopop .stats { margin-bottom:12px; }
.stats { width:100%; border-collapse:collapse; font-size:.85rem; }
.stats th, .stats td { padding:5px 4px; text-align:center; font-variant-numeric:tabular-nums; border-top:1px solid var(--line); }
.stats th:first-child, .stats tbody th { text-align:left; font-weight:500; }
.stats thead th { color:var(--muted); font-weight:500; border-top:0; }

/* ---- 横に広い画面（PC・横向きのスマホ）：1画面に収める ---- */
html.wide body { height:100vh; height:100dvh; overflow:hidden; }
html.wide .app { height:100vh; height:100dvh; display:grid; grid-template-columns:minmax(0,1fr) clamp(220px, 30vw, 360px); gap:14px; padding:14px; }
html.wide .left { min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; gap:10px; }
html.wide .stage { min-height:0; }
html.wide .right { min-height:0; display:grid; grid-template-rows:minmax(0,1fr); }
html.wide .right .panel { min-height:0; }
html.wide .right .games { overflow:auto; }
/* 横向きのスマホ（低い）：すき間を詰める */
@media (max-height: 559px) {
  html.wide .app { gap:8px; padding:6px 8px; }
  html.wide .left { gap:4px; }
  html.wide header h1 { font-size:.75rem; }
  html.wide .total { font-size:1.15rem; }
}

/* ---- 重ねる配置（全画面・横向きのスマホ）：動画を下まで広げ、シークバーとボタンを上に重ねる ---- */
html.ov .left { grid-template-rows:auto minmax(0,1fr) auto auto; grid-template-columns:minmax(0,1fr); gap:0 !important; }
html.ov .stage { grid-row:2 / 5; grid-column:1; }
html.ov header { margin-bottom:4px; }
html.ov .seek, html.ov .controls { grid-column:1; position:relative; z-index:6; transition:opacity .25s;
  --fg:#fff; --bg:#111; --muted:#ddd; --card:#000; --line:rgba(255,255,255,.3); --track:rgba(255,255,255,.25); --played:rgba(255,255,255,.55);
  --a:#f07484; --b:#5db6d9; color:var(--fg); }
html.ov .seek { grid-row:3; margin:0 12px; }

<script>
// フォルダの index.html では、データはここに入っている。Web に置いたページ（データなし）では、
// URL の #d=ドライブのフォルダID&k=APIキー から、ドライブの data/page.json などを読む
const EMBEDDED = {{PAGE}};
const DRIVE = (() => {
  const h = new URLSearchParams(location.hash.slice(1));
  // 読み込み先を変える api= は、手元での確認用。公開したページでは使わせない（よそのデータを読ませられないように）
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);
  const api = local && h.get('api') ? h.get('api') : 'https://www.googleapis.com/drive/v3';
  return h.get('d') ? { folder: h.get('d'), key: h.get('k') || '', api, ids: {}, size: {}, base: '' } : null;
})();
// ページの中の場所（videos/game01.mp4 など）を、読み込む URL に
function media(path) {
  if (!DRIVE) return path;
  const id = DRIVE.ids[DRIVE.base + path];
  return id ? `${DRIVE.api}/files/${id}?alt=media&key=${encodeURIComponent(DRIVE.key)}` : '';
}
// 見る人に出すエラー（title：何が起きたか、detail：どうすればよいか）
class ViewError extends Error {
  constructor(title, detail) { super(title); this.detail = detail; }
}
// ドライブの API のエラーを、分かる言葉に
async function driveError(r, what) {
  let msg = '';
  try { msg = (await r.json()).error?.message || ''; } catch {}
  const m = msg.toLowerCase();
  if (m.includes('referer') || m.includes('referrer'))
    return new ViewError('キーがこのページで使えない設定です', 'API キーの「ウェブサイトの制限」に、このページのアドレスを入れてください。');
  if (m.includes('api key not valid') || m.includes('api_key_invalid'))
    return new ViewError('リンクのキーが正しくありません', 'リンクの k= の部分（API キー）を確かめてください。');
  if (m.includes('has not been used') || m.includes('is disabled'))
    return new ViewError('ドライブの読み取りが有効になっていません', 'Google Cloud で Google Drive API を有効にしてください。');
  if (m.includes('quota') || m.includes('rate limit') || r.status === 429)
    return new ViewError('ドライブの読み込みの上限に達しました', 'しばらく（数時間〜1日）おいてから開き直してください。');
  if (r.status === 404)
    return new ViewError(`${what}が見つかりません`, 'リンクの d= の部分（フォルダ）が正しいか、フォルダが「リンクを知っている全員」で共有されているかを確かめてください。');
  if (r.status === 403)
    return new ViewError(`${what}を読む許可がありません`, 'フォルダが「リンクを知っている全員」で共有されているかを確かめてください。');
  return new ViewError(`${what}を読めませんでした（${r.status}）`, msg);
}
// 一度にたくさん読むと、ドライブが一部を弾くことがある（弾いた返事は CORS がなく、通信エラーに見える）。
// 少し待ってやり直す
const RETRY_WAIT = [1000, 3000];
async function driveFetch(url, what) {
  for (let k = 0; ; k++) {
    let r = null;
    try { r = await fetch(url); } catch {}
    if (r && r.ok) return r;
    const retry = !r || r.status === 429 || r.status >= 500 || (r.status === 403 && /rate|quota/i.test(await r.clone().text()));
    if (retry && k < RETRY_WAIT.length) { await new Promise(res => setTimeout(res, RETRY_WAIT[k])); continue; }
    if (!r) throw new ViewError('通信できませんでした', `${what} を読み込めませんでした。少しおいて、もう一度開いてください。`);
    throw await driveError(r, what);
  }
}
// 同時に読むのは n 個まで
async function inTurn(items, n, f) {
  const queue = [...items];
  await Promise.all(Array.from({ length: n }, async () => { while (queue.length) await f(queue.shift()); }));
}
const boot = document.getElementById('boot');
// ドライブのページへのリンク。行き先は drive.google.com で固定し、URL からは ID だけを使う（ほかへ飛ばされないように）
const DRIVE_ID = /^[A-Za-z0-9_-]{10,200}$/;
function driveFolderUrl() {
  return DRIVE && DRIVE_ID.test(DRIVE.folder) ? `https://drive.google.com/drive/folders/${encodeURIComponent(DRIVE.folder)}` : null;
}
function driveFileUrl(path) {
  const id = DRIVE && DRIVE.ids[DRIVE.base + path];
  return id && DRIVE_ID.test(id) ? `https://drive.google.com/file/d/${encodeURIComponent(id)}/view` : null;
}
{
  const b = document.getElementById('drivelink'), url = driveFolderUrl();
  const pop = document.getElementById('drivepop');
  if (url) {
    document.getElementById('drivego').href = url;
    b.hidden = false;
    b.onclick = e => { e.stopPropagation(); pop.hidden = !pop.hidden; };
    document.getElementById('drivego').onclick = () => { pop.hidden = true; };
    document.getElementById('drivecancel').onclick = () => { pop.hidden = true; };
    document.addEventListener('click', e => { if (!pop.hidden && !pop.contains(e.target) && e.target !== b) pop.hidden = true; });
  }
}
function showLoading(text) {
  // 進み具合のたびに作り直すと、くるくるが最初に戻って回らない
  if (!boot.querySelector('.spin')) boot.innerHTML = '<div class="spin"></div><p></p>';
  boot.querySelector('p').textContent = text;
  boot.hidden = false;
}
// link：ドライブで直接見るためのページ（なければフォルダ）
function showError(e, link) {
  const title = e instanceof ViewError ? e.message : '読み込めませんでした';
  const detail = e instanceof ViewError ? e.detail : e.message;
  boot.innerHTML = '<div class="err">⚠</div><h2></h2><p></p><button>もう一度</button>';
  boot.querySelector('h2').textContent = title;
  boot.querySelector('p').textContent = detail || '';
  const url = link || driveFolderUrl();
  if (url) {
    const a = document.createElement('a');
    a.className = 'drive'; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.href = url;
    a.textContent = link ? 'ドライブで見る' : 'ドライブで開く';
    boot.append(a);
  }
  // やり直すときは、覚えていたフォルダの中身も読み直す（アップロードし直した直後など）
  boot.querySelector('button').onclick = () => { try { if (DRIVE) localStorage.removeItem(`drive-list-${DRIVE.folder}`); } catch {} location.reload(); };
  boot.hidden = false;
}
// 回の一覧（フォルダ名）から選ぶ。選ぶとリンクに #s= を足して開き直す
const CHOOSING = new Error('choosing');
function showChooser(bases) {
  boot.innerHTML = '<h2>どの回を見ますか</h2><div class="choose"></div>';
  const box = boot.querySelector('.choose');
  for (const b of bases) {
    const name = b.replace(/\/$/, '').split('/').pop();
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.onclick = () => { const h = new URLSearchParams(location.hash.slice(1)); h.set('s', name); location.hash = h.toString(); location.reload(); };
    box.append(btn);
  }
  boot.hidden = false;
}
async function driveList(id, prefix) {
  const q = encodeURIComponent(`'${id}' in parents and trashed=false`);
  const r = await driveFetch(`${DRIVE.api}/files?q=${q}&fields=files(id,name,mimeType,modifiedTime,size)&pageSize=1000&key=${encodeURIComponent(DRIVE.key)}`, 'フォルダ');
  for (const f of (await r.json()).files || []) {
    if (f.mimeType === 'application/vnd.google-apps.folder') await driveList(f.id, `${prefix}${f.name}/`);
    else {
      DRIVE.ids[`${prefix}${f.name}`] = f.id; DRIVE.mod[`${prefix}${f.name}`] = f.modifiedTime || '';
      DRIVE.size[`${prefix}${f.name}`] = +f.size || 0;
    }
  }
}
// ドライブは短い間に何度も読むと弾くので、フォルダの中身とデータはブラウザに覚えておく。
// 中身の一覧は LIST_TTL の間だけ使い回す（その間にドライブで差し替えたものは、過ぎてから反映）
const LIST_TTL = 10 * 60 * 1000;
async function driveListCached() {
  const key = `drive-list-${DRIVE.folder}`;
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (c && c.size && Date.now() - c.at < LIST_TTL) { DRIVE.ids = c.ids; DRIVE.mod = c.mod; DRIVE.size = c.size; return; }
  } catch {}
  await driveList(DRIVE.folder, '');
  try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), ids: DRIVE.ids, mod: DRIVE.mod, size: DRIVE.size })); } catch {}
}
// ファイルの中身。同じファイル（ID と更新日時が同じ）なら、前に読んだものを使う
async function driveText(path, url) {
  const cacheKey = `https://cache.invalid/${DRIVE.ids[DRIVE.base + path]}/${encodeURIComponent(DRIVE.mod[DRIVE.base + path] || '')}`;
  let cache = null;
  try { cache = await caches.open('tt-share'); const hit = await cache.match(cacheKey); if (hit) return hit.text(); } catch {}
  const text = await (await driveFetch(url, path)).text();
  try { await cache?.put(cacheKey, new Response(text)); } catch {}
  return text;
}
async function loadPage() {
  if (EMBEDDED) return EMBEDDED;
  if (!DRIVE) throw new ViewError('見るまとめが指定されていません', '共有されたリンクをそのまま開いてください（# から後ろも必要です）。');
  if (!DRIVE_ID.test(DRIVE.folder)) throw new ViewError('リンクが正しくありません', '共有されたリンクをそのまま開いてください（d= の部分が壊れています）。');
  if (!DRIVE.key) throw new ViewError('リンクにキーがありません', '共有されたリンクをそのまま開いてください（k= の部分も必要です）。');
  showLoading('フォルダを確認中…');
  DRIVE.mod = {};
  await driveListCached();
  // 共有したフォルダの中に、日付ごとのまとめのフォルダが並んでいてもよい。
  // 1つならそれを、いくつもあれば #s= の回か、一覧から選んでもらう
  const bases = Object.keys(DRIVE.ids).filter(p => p.endsWith('data/page.json'))
    .map(p => p.slice(0, -'data/page.json'.length));
  // 新しい回（フォルダ名の大きい順）から
  const nameOf = b => b.replace(/\/$/, '').split('/').pop();
  bases.sort((a, b) => nameOf(b).localeCompare(nameOf(a)));
  const want = new URLSearchParams(location.hash.slice(1)).get('s');
  let hit = null;
  if (want) {
    const b = bases.find(b => b.replace(/\/$/, '').split('/').pop() === want);
    if (!b) throw new ViewError(`${want} の回が見つかりません`, 'リンクの s= の部分を確かめてください。');
    hit = `${b}data/page.json`;
  } else if (bases.length > 1) {
    showChooser(bases);
    throw CHOOSING;
  } else if (bases.length) hit = `${bases[0]}data/page.json`;
  DRIVE.sessions = bases.map(b => b.replace(/\/$/, '').split('/').pop());
  if (hit) DRIVE.session = hit.slice(0, -'/data/page.json'.length).split('/').pop();
  if (!hit) {
    const found = Object.keys(DRIVE.ids);
    throw new ViewError('フォルダにまとめのデータがありません',
      `data/page.json が見つかりません。アップロードが終わっているか確かめてください。（見つかったファイル ${found.length} 件${found.length ? '：' + found.slice(0, 3).join('、') : ''}）`);
  }
  DRIVE.base = hit.slice(0, -'data/page.json'.length);
  const get = async path => {
    const url = media(path);
    if (!url) throw new ViewError(`${path} が見つかりません`, 'アップロードが終わっているか確かめてください。');
    return driveText(path, url);
  };
  showLoading('データを読み込み中…');
  let page;
  try { page = JSON.parse(await get('data/page.json')); }
  catch (e) { if (e instanceof ViewError) throw e; throw new ViewError('まとめのデータが壊れています', 'data/page.json を上げ直してください。'); }
  showLoading('顔の位置を読み込み中…');
  // 顔の位置（faces-gameNN.js）は、中の JSON だけを取り出す
  window.FACES = {};
  if (page.faces) { window.FACES = page.faces; return page; }
  const faceFiles = Object.keys(DRIVE.ids).filter(p => p.startsWith(DRIVE.base))
    .map(p => p.slice(DRIVE.base.length)).filter(p => /^data\/faces-game\d+\.js$/.test(p));
  await inTurn(faceFiles, 3, async p => {
    const text = await get(p);
    window.FACES[+p.match(/(\d+)\.js$/)[1]] = JSON.parse(text.slice(text.indexOf('] = ') + 4, text.lastIndexOf(';')));
  });
  return page;
}

(async () => {
let PAGE;
if (!EMBEDDED) {
  // データが来るまでの仮の枠
  document.getElementById('date').innerHTML = '<span class="skel skel-line" style="width:9em"></span>';
  document.getElementById('total').innerHTML = '<span class="skel skel-line" style="width:6em"></span>';
  document.getElementById('games').innerHTML = '<div class="skel skel-game"></div>'.repeat(6);
}

// ---------- 流れのグラフ（中央線より上は A のリード、下は B のリード） ----------
function flowSVG(g, id, mark) {
  const gi = DATA.games.indexOf(g);
  const W = 300, H = 36, M = H / 2, n = g.points.length;
  const ds = [0, ...g.points.map(p => p.s[0] - p.s[1])];
  const max = Math.max(3, ...ds.map(Math.abs));
  const x = i => (i / n) * (W - 4) + 2, y = d => M - d / max * (M - 3);
  // 1点ごとの階段にする（どこで点が動いたかが見やすい）
  let line = `M${x(0)} ${y(0)}`;
  for (let i = 1; i <= n; i++) line += ` H${x(i).toFixed(1)} V${y(ds[i]).toFixed(1)}`;
  const area = `${line} V${M} H${x(0)} Z`;
  const markX = mark == null ? null : x(mark + 1);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <clipPath id="t${id}"><rect x="0" y="0" width="${W}" height="${M}"/></clipPath>
      <clipPath id="u${id}"><rect x="0" y="${M}" width="${W}" height="${M}"/></clipPath>
    </defs>
    <g clip-path="url(#t${id})"><path d="${area}" fill="var(--a-soft)"/><path d="${line}" fill="none" stroke="var(--a)" stroke-width="2" vector-effect="non-scaling-stroke"/></g>
    <g clip-path="url(#u${id})"><path d="${area}" fill="var(--b-soft)"/><path d="${line}" fill="none" stroke="var(--b)" stroke-width="2" vector-effect="non-scaling-stroke"/></g>
    <line x1="0" x2="${W}" y1="${M}" y2="${M}" stroke="var(--muted)" stroke-width="1" opacity=".55" vector-effect="non-scaling-stroke"/>
    ${g.points.map((p, k) => {
      if (!isStar(gi, k)) return '';
      const px = x(k + 1).toFixed(1);
      return `<line x1="${px}" x2="${px}" y1="0" y2="${H}" stroke="var(--star)" stroke-width="3" opacity=".6" vector-effect="non-scaling-stroke"/>`;
    }).join('')}
    ${markX == null ? '' : `<line x1="${markX}" x2="${markX}" y1="0" y2="${H}" stroke="var(--fg)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`}
  </svg>`;
}

function renderGames(mark) {
  const box = document.getElementById('games');
  box.innerHTML = DATA.games.map((g, i) => {
    const cls = g.winner === null ? '' : (g.winner === 0 ? 'a' : 'b');
    return `<button class="game ${i === current ? 'sel' : ''}" data-i="${i}">
      <span class="no">第${g.n}ゲーム</span>
      <span class="sc ${cls}">${g.final[0]} - ${g.final[1]}<small>${g.winner === null ? '途中' : g.minutes + '分'}</small></span>
      ${flowSVG(g, i, i === current ? mark : null)}
    </button>`;
  }).join('');
  box.querySelectorAll('.game').forEach(b => b.onclick = e => {
    const i = +b.dataset.i, g = DATA.games[i];
    // ドライブで、まだ読んでいない動画は、すぐ切り替えずに読み込むか聞く

    select(i, !DRIVE || have.has(g.video) || !!blobUrls[g.video]);

}
// 読み込み済みは明るく、まだは暗く。読み込み中は左から明るく
function paintGame(path) {
  if (!DRIVE) return;
  DATA.games.forEach((g, i) => {
    if (g.video !== path) return;
    const b = document.querySelector(`.game[data-i="${i}"]`);
    if (!b) return;
    const done = have.has(path) || !!blobUrls[path];
    b.classList.toggle('need', !done);
    b.classList.toggle('err', !done && !!failed[path]);
    b.style.setProperty('--p', `${(progress[path] || 0) * 100}%`);
  });
  if (dlFor != null && DATA.games[dlFor].video === path) fillDl();
}

    m.className = `mk ${p.w === 0 ? 'a' : 'b'}`;
    m.style.left = `${x}px`;
    m.style.color = p.w === 0 ? 'var(--a)' : 'var(--b)';
    m.innerHTML = `<b>${p.s[0]}-${p.s[1]}</b><i></i>`;
    // 文字が重なるところは数字を隠す（触れると出る）

    m.dataset.vt = p.vt;

    m.onmouseleave = hideTip;
    seek.appendChild(m);

  updateHead();
}

// 画面ごと90度回しているときは、画面の縦が中身の横

function currentIndex() {

function jump(p) {
  v.currentTime = startOf(p);
  v.play();
}

function step(dir) {
  const ps = points();
  if (!ps.length) return;
  const t = v.currentTime;
  const next = dir > 0 ? ps.find(p => startOf(p) > t + 0.5) : [...ps].reverse().find(p => startOf(p) < t - 1.5);
  if (next) jump(next); else if (dir < 0) v.currentTime = 0;
}

// ---------- 再生 ----------
// ドライブから見るときは、押されるまで動画を読まない（ドライブは何度も読むと弾くため）。
// 読む前の位置と長さは覚えておき、play() されたら読み込んで、その位置から再生する
let pending = null, pendingTime = 0, activate = null;
const bigplay = document.getElementById('bigplay');

// ドライブの動画を、少しずつ何度も読むと Google に機械的なアクセスとみなされて止められる。
// そこで1ファイルを1回で丸ごと読み、ブラウザの中に残す（2回目からは読まない）。
// 丸ごと読んだものは同じページのデータになるので、保存（書き出し）もそのままできる
const KEEP_VIDEOS = 10;             // ブラウザに残す動画の数（古いものから消す）
const blobUrls = {};                // 場所 → ページの中の URL
const blobOf = {};                  // ページの中の URL → 中身（保存のときにコピーせず読む）
const keepBlob = b => { const u = URL.createObjectURL(b); blobOf[u] = b; return u; };

const progress = {};                // 読み込み中の場所 → 0〜1
const failed = {};                  // 読み込めなかった場所 → エラー
const aborts = {};                  // 読み込み中の場所 → 止める
const watchers = {};
const IN_MEMORY = 2;                // ブラウザに残せないとき、ページの中に持つ動画の数
const memOrder = [];                // 場所 → 進み具合を受け取る関数
function cacheKey(path) {
  return `https://cache.invalid/media/${DRIVE.ids[DRIVE.base + path]}/${encodeURIComponent(DRIVE.mod[DRIVE.base + path] || '')}`;
}
const sizeOf = path => DRIVE.size?.[DRIVE.base + path] || 0;
const openCache = () => caches.open('tt-media').catch(() => null);
async function fromCache(path) {
  const cache = await openCache();
  const hit = await cache?.match(cacheKey(path)).catch(() => null);
  if (!hit) return null;
  return (blobUrls[path] = keepBlob(await hit.blob()));
}
const loadOrder = () => { try { return JSON.parse(localStorage.getItem('tt-media-order')) || []; } catch { return []; } };
const saveOrder = o => { try { localStorage.setItem('tt-media-order', JSON.stringify(o)); } catch {} };
// 入れる前に、古いものを消して場所を空ける（今見ているゲームは消さない）
async function makeRoom(cache, need) {
  const keep = cacheKey(DATA.games[current].video || '');
  const order = loadOrder();
  const est = await navigator.storage?.estimate?.().catch(() => null);
  let free = est ? est.quota - est.usage : Infinity;
  for (let k = 0; k < order.length && (order.length >= KEEP_VIDEOS || free < need * 1.1);) {
    if (order[k] === keep) { k++; continue; }
    const key = order.splice(k, 1)[0];
    const res = await cache.match(key).catch(() => null);
    free += +res?.headers.get('x-size') || 0;
    await cache.delete(key).catch(() => {});
    for (const g of DATA.games) if (g.video && cacheKey(g.video) === key) { have.delete(g.video); paintGame(g.video); }
  }
  saveOrder(order);
  return free >= need * 1.1;
}
function setProgress(path, f) {
  if (f !== null && Math.floor(f * 100) === Math.floor((progress[path] ?? -1) * 100)) return;  // 1% ごとに
  if (f === null) delete progress[path]; else progress[path] = f;
  paintGame(path);
  watchers[path]?.forEach(fn => fn(f));
}
async function fetchMedia(path) {
  const ctrl = new AbortController();
  aborts[path] = () => ctrl.abort();
  delete failed[path];
  setProgress(path, 0);
  try {
    let r;
    try { r = await fetch(media(path), { signal: ctrl.signal }); }
    catch (e) {
      if (e.name === 'AbortError') throw e;
      throw new ViewError('Google に一時的に止められています', '時間をおいて開き直してください。');
    }
    if (!r.ok) throw await driveError(r, path);
    const total = +r.headers.get('content-length') || sizeOf(path);
    const type = r.headers.get('content-type') || 'video/mp4';
    // まず全部読む（読みながら保存場所へ書くと、空きの少ないブラウザでは途中で失敗して全部むだになる）
    const reader = r.body.getReader(), parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      if (total) setProgress(path, Math.min(got / total, 0.999));
    }
    const blob = new Blob(parts, { type });
    parts.length = 0;
    const cache = await openCache();
    const video = /\.mp4$/.test(path);
    if (cache && (!video || await makeRoom(cache, blob.size))) {
      try {
        await cache.put(cacheKey(path), new Response(blob, { headers: { 'content-type': type, 'x-size': String(blob.size) } }));
        if (video) { const o = loadOrder().filter(k => k !== cacheKey(path)); o.push(cacheKey(path)); saveOrder(o); have.add(path); }
        return;
      } catch (e) { console.warn('ブラウザに残せませんでした', e); }
    }
    // 残せないときは、ページを開いている間だけ持つ（メモリを使うので、動画は今見ているもの以外 IN_MEMORY 本まで）
    blobUrls[path] = keepBlob(blob);
    if (video) {
      memOrder.push(path);
      for (let k = 0; memOrder.length > IN_MEMORY && k < memOrder.length;) {
        const old = memOrder[k];
        if (old === DATA.games[current].video || old === path) { k++; continue; }
        memOrder.splice(k, 1);
        URL.revokeObjectURL(blobUrls[old]); delete blobOf[blobUrls[old]]; delete blobUrls[old]; paintGame(old);
      }

    throw e;
  } finally {

    setProgress(path, null);
  }

// 読み込みは順番に1本ずつ。今見るもの（urgent）は待たずに始める
const jobs = {}, queue = [];
let busy = 0;

  fetchMedia(job.path).then(job.res, job.rej).finally(() => { busy--; next(); });
}
function next() { if (!busy && queue.length) run(queue.shift()); }
function mediaBlob(path, { urgent = false, onProgress } = {}) {

    if (progress[path] != null) onProgress(progress[path]);
  }
  if (jobs[path]) {
    // 順番待ちのものを、今見るなら先に
    const k = queue.findIndex(j => j.path === path);
    if (urgent && k >= 0) run(queue.splice(k, 1)[0]);
  } else {
    jobs[path] = (async () => {
      const hit = await fromCache(path);
      if (hit) return hit;
      await new Promise((res, rej) => { const job = { path, res, rej }; if (urgent) run(job); else { queue.push(job); next(); } });

const mb = n => `${Math.round(n / 1e6)}MB`;
// 読み込みの確認
const dlpop = document.getElementById('dlpop');
let dlFor = null;
function openDl(i, card) {
  dlFor = i;
  fillDl();
  dlpop.hidden = false;
  const r = card.getBoundingClientRect(), h = dlpop.offsetHeight, w = dlpop.offsetWidth;
  dlpop.style.left = `${Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8))}px`;
  dlpop.style.top = `${r.bottom + 6 + h < innerHeight ? r.bottom + 6 : Math.max(8, r.top - h - 6)}px`;
}
function closeDl() { dlpop.hidden = true; dlFor = null; }
function fillDl() {
  const g = DATA.games[dlFor], path = g.video;
  if (have.has(path) || blobUrls[path]) { closeDl(); return; }
  const loading = progress[path] != null || queue.some(j => j.path === path);
  const size = sizeOf(path);
  dlpop.innerHTML = `<b></b><p class="sub"></p><div class="row"></div>`;
  dlpop.querySelector('b').textContent = `第${g.n}ゲーム`;
  dlpop.querySelector('.sub').textContent = loading
    ? (progress[path] != null ? `読み込み中 ${Math.floor(progress[path] * 100)}%` : '順番待ち')
    : failed[path] ? failed[path].message : size ? mb(size) : '';
  const row = dlpop.querySelector('.row');
  const btn = (text, cls, fn) => { const b = document.createElement('button'); b.textContent = text; if (cls) b.className = cls; b.onclick = fn; row.append(b); };
  if (loading) {
    btn('止める', '', () => { cancelMedia(path); closeDl(); });
    btn('閉じる', '', closeDl);
  } else {
    btn('読み込む', 'go', () => { mediaBlob(path).catch(() => {}); closeDl(); });
    btn('やめる', '', closeDl);
  }
}
document.addEventListener('click', e => { if (!dlpop.hidden && !dlpop.contains(e.target)) closeDl(); });
// 通信量の注意（閉じたら、このブラウザでは出さない）
if (DRIVE && store.get('dataNote') !== '0') {

  const note = document.getElementById('datanote');
  note.querySelector('span').textContent = sizes.length
    ? `通信量に注意　動画は1本 ${mb(Math.min(...sizes))}〜${mb(Math.max(...sizes))}` : '通信量に注意';
  note.querySelector('button').onclick = () => { note.hidden = true; store.set('dataNote', '0'); };
  note.hidden = false;
}
// 最初に、どの動画がブラウザに残っているか調べる
if (DRIVE) {

    if (!cache) return;
    for (const g of DATA.games) for (const p of new Set([g.video, g.full])) {
      if (p && await cache.match(cacheKey(p)).catch(() => null)) have.add(p);
    }
    DATA.games.forEach(g => g.video && paintGame(g.video));

}
if (DRIVE) {

// ---------- 画角（拡大と、ドラッグで位置合わせ） ----------
// 映像が枠に収まる大きさ（contain）を基準に、zoom 倍して、映像上の (cx, cy) を枠の中央に置く
// 傾けると四隅に黒が出るので、そのぶんだけ大きくする倍率
function tiltScale(w, h) {
  const r = Math.abs(view.rot) * Math.PI / 180;
  return r ? Math.cos(r) + Math.max(w / h, h / w) * Math.sin(r) : 1;
}
// 映像（大きさ w×h）の中で、見える範囲（bw×bh）がはみ出さない中心
function clampCenter(w, h, bw, bh) {
  const r = Math.abs(view.rot) * Math.PI / 180, c = Math.cos(r), n = Math.sin(r);
  const ex = (bw * c + bh * n) / 2 / w, ey = (bw * n + bh * c) / 2 / h;
  const fit = (x, e) => e >= 0.5 ? 0.5 : Math.min(Math.max(x, e), 1 - e);
  return [fit(view.cx, ex), fit(view.cy, ey)];
}
function applyView() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const vw = v.videoWidth || 16, vh = v.videoHeight || 9;
  const base = Math.min(W / vw, H / vh);
  const s = base * view.zoom * tiltScale(vw, vh);
  const dw = vw * s, dh = vh * s;
  // 見える枠：動画の枠と画面の重なり
  const bw = Math.min(W, vw * base * view.zoom), bh = Math.min(H, vh * base * view.zoom);

  v.style.objectFit = 'fill';
  v.style.width = `${dw}px`; v.style.height = `${dh}px`;
  v.style.left = '0'; v.style.top = '0'; v.style.right = 'auto'; v.style.bottom = 'auto';
  v.style.transform = `translate(${W / 2}px, ${H / 2}px) rotate(${view.rot}deg) translate(${-px}px, ${-py}px)`;

    const ax = x * bw / 2, ay = y * bh / 2;

  m.style.width = `${dw}px`; m.style.height = `${dh}px`; m.style.transform = v.style.transform; m.style.clipPath = clip;

const MAX_TILT = 10, rotKey = `rot-${DATA.id}`;
const rotBtn = document.getElementById('rotreset');
function setRot(deg) {

  rotBtn.hidden = !view.rot;

  store.set(rotKey, String(view.rot));

}
rotBtn.addEventListener('pointerdown', e => e.stopPropagation());

rotBtn.onclick = e => { e.stopPropagation(); setRot(0); };
function setZoom(z, keepCenter) {

  const tag = document.getElementById('zoomtag');
  tag.textContent = `${view.zoom.toFixed(2)}×`; tag.classList.add('show');
  clearTimeout(setZoom.t); setZoom.t = setTimeout(() => tag.classList.remove('show'), 800);

// ドラッグで動かす。2本指で広げる・縮める、ひねると角度。動かさずに離したら再生／一時停止

// 試合の外での位置から決め、試合の外に映っていなければ試合中の位置から。カメラのすぐ前は数えない

async function mixAudio(st, dest, from, rate) {

  for (;;) {
    if (!st.cur) {
      const r = await st.it.next();
      if (r.done) return;
      const x = r.value, n = x.numberOfFrames, data = new Float32Array(n), plane = new Float32Array(n);

        x.copyTo(plane, { planeIndex: ch, format: 'f32-planar' });
        for (let i = 0; i < n; i++) data[i] += plane[i] / x.numberOfChannels;
      }
      st.cur = { t: x.timestamp, data, rate: x.sampleRate };
      x.close();
    }
    const c = st.cur, end = c.t + c.data.length / c.rate;
    const i0 = Math.max(0, Math.ceil((c.t - from) * rate)), i1 = Math.min(dest.length, Math.ceil((end - from) * rate));

const MEDIABUNNY = 'https://cdn.jsdelivr.net/npm/mediabunny@1.63.0/dist/bundles/mediabunny.min.mjs';

  const { ow, oh, share } = outputOf(tier, W, H, cw, ch);
  if (!(await M.canEncodeVideo('avc', { width: ow, height: oh }).catch(() => false))) return false;
  const full = new OffscreenCanvas(W, H), fctx = full.getContext('2d');
  const asIs = ow === W && oh === H && !view.rot;  // 切り取りも縮小もなければ、1回ぶん描かずに済む
  const out = asIs ? full : new OffscreenCanvas(ow, oh), octx = asIs ? fctx : out.getContext('2d');

  const ranges = keptRanges(g, duration).map(([x, y]) => [Math.max(0, x), Math.min(duration, y)]).filter(([x, y]) => y > x);

  // コマ数を伝えないと圧縮器が 30 コマと見なして大きくなる。一定のビットレートで、端末によらず狙った大きさに
  const srcFps = Math.round((await track.computePacketStats(120)).averagePacketRate) || 60;
  const frameRate = Math.min(tier.fps || srcFps, srcFps);
  const bitrate = Math.round((bytes ? bytes * 8 / duration : FALLBACK_BITRATE) * share);
  // 音：カメラの音に胸元マイクを重ねて、作り直す
  const RATE = 48000, AUDIO_BITRATE = 128e3;
  const camTrack = await input.getPrimaryAudioTrack().catch(() => null);
  let micTrack = null, micLost = false;

  } catch (e) {
    if (stopped) { clipmsg.textContent = ''; clippop.hidden = true; return true; }
    console.warn('速い保存に失敗', e);
    output.cancel().catch(() => {});

    return true;

    recording = null;
    stopBtn.hidden = true; stopBtn.textContent = '止めて保存';

  link.href = URL.createObjectURL(new Blob([output.target.buffer], { type: 'video/mp4' }));
  link.download = `${document.title.split(' ')[0]}-第${g.n}ゲーム.mp4`;
  link.textContent = link.download;
  clipmsg.innerHTML = '';
  clipmsg.append(link);
  if (micLost) clipmsg.append('（マイクなし）');
  link.click();

}

async function startSave(g, tier) {

    const label = path === g.full && path !== g.video ? '元動画' : '動画';
    recording = { stop: () => cancelMedia(path) };
    stopLoad.textContent = 'やめる'; stopLoad.hidden = false;
    try {
      url = await mediaBlob(path, { urgent: true, onProgress: f =>
        { if (f !== null) clipmsg.textContent = `${label}を読み込み中… ${Math.floor(f * 100)}%`; } });
    } catch (e) {
