# iOS アプリのビルド。手元に Mac が無いので、ここが「コンパイルが通るか」の唯一の門。
#
# 署名はしない。できた IPA は Sideloadly で手元の iPhone / iPad に入れる
# （有料 Developer 登録の Apple ID で入れれば1年有効）。
name: iOS Build

on:
  push:
    paths:
      - 'App/**'
      - 'Packages/**' # ロジック側の変更でもアプリのコンパイルは壊れうる
      - 'project.yml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS ランナー（arm64 が混んでいて始まらないときは macos-15-intel を選ぶ）'
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-15-intel

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30 # 詰まったときに macOS 分を食い潰さないための上限
    steps:
      - uses: actions/checkout@v5

      - name: Xcode のバージョン
        run: xcodebuild -version

      - name: XcodeGen でプロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate

      - name: ビルド（署名なし）
        run: |
          set -o pipefail
          xcodebuild \
            -project TTLog.xcodeproj \
            -scheme TTLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 同じ名前の IPA が手元に並ぶとどれがどれか分からなくなるので、
      # バージョン・ビルド番号・短縮 SHA を名前に入れる
      - name: IPA を作る（Sideloadly 用）
        run: |
          APP=build/Build/Products/Release-iphoneos/TTLog.app
          V=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          B=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          NAME="ttlog-v${V}-b${B}-$(git rev-parse --short HEAD)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$NAME.ipa" Payload
          ls -lh "$NAME.ipa"
          echo "ARTIFACT=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.ipa
          retention-days: 14
