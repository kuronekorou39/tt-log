# README 用のキャプチャ。シミュレーターで見本の画面（起動引数 -demo）を開いて撮る。
# 画面を変えたときだけ手で動かす。
name: Screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: XcodeGen でプロジェクトを生成
        run: |
          brew install xcodegen
          xcodegen generate

      - name: iPad のシミュレーターを起動
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for k, v in json.load(sys.stdin)["devices"].items() if "iOS" in k for d in v]
          for pref in ("iPad Pro 13", "iPad Air 13", "iPad Pro", "iPad Air", "iPad"):
              m = [d for d in devs if d["name"].startswith(pref)]
              if m:
                  print(m[-1]["udid"]); break
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3

      - name: ビルドして入れる
        run: |
          set -o pipefail
          xcodebuild -project TTLog.xcodeproj -scheme TTLog -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build build
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/TTLog.app

      - name: 撮る
        run: |
          mkdir -p shots
          for s in playing gameWon result deviceLog; do
            xcrun simctl terminate "$UDID" com.rou39.ttlog || true
            xcrun simctl launch "$UDID" com.rou39.ttlog -demo "$s" -AppleLanguages "(ja)" -AppleLocale ja_JP
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/$s.png"
          done
          ls -l shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          retention-days: 14
