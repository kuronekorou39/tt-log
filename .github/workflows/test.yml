# ロジック（Packages/TTLogCore）のテスト。Linux で回すので安く速い。
name: Core Tests

on:
  push:
    paths:
      - 'Packages/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        working-directory: Packages/TTLogCore
        run: swift test
